# ==============================================================================
# PayFlow Sandbox Payment Gateway - Render Infrastructure Blueprint
# ==============================================================================
# Architecture:
# 1. payflow-backend: Express + TypeScript Web Service (Free Tier)
# 2. payflow-frontend: React + TypeScript + Vite Static Site (Free Tier)
# 3. payflow-postgres: Managed PostgreSQL Database (Free Tier)
#
# IMPORTANT NOTICE ON RENDER FREE TIER LIMITATIONS:
# - Managed PostgreSQL (Free Tier): Expires 30 days after creation. Data will be
#   deleted unless upgraded to Starter ($7/mo).
# - Web Service (Free Tier): Spins down after 15 minutes of inactivity; initial
#   requests may experience a ~50s cold-start delay. 512MB RAM limit.
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # Backend API Web Service
  # ----------------------------------------------------------------------------
  - type: web
    name: payflow-backend
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm install --include=dev && npm run prisma:generate && npm run build
    startCommand: npm run prisma:deploy && npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        fromDatabase:
          name: payflow-postgres
          property: connectionString
      - key: CORS_ORIGIN
        # Update in Render Dashboard after frontend creation:
        # e.g., https://payflow-frontend.onrender.com
        value: http://localhost:5173
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: WEBHOOK_DEFAULT_URL
        value: ""

  # ----------------------------------------------------------------------------
  # Frontend Static Web App
  # ----------------------------------------------------------------------------
  - type: web
    name: payflow-frontend
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm install --include=dev && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        # Set in Render Dashboard to your backend service URL:
        # e.g., https://payflow-backend.onrender.com (without trailing slash)
        value: ""

# ------------------------------------------------------------------------------
# Managed PostgreSQL Database
# ------------------------------------------------------------------------------
databases:
  - name: payflow-postgres
    databaseName: payflow_db
    user: payflow_user
    plan: free
    region: oregon
