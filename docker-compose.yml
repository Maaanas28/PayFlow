version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: payflow-postgres
    restart: always
    environment:
      POSTGRES_USER: payflow_user
      POSTGRES_PASSWORD: payflow_password
      POSTGRES_DB: payflow_db
    ports:
      - "5432:5432"
    volumes:
      - payflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payflow_user -d payflow_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  payflow_pgdata:
    driver: local
